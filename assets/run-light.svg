<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 424" role="img" aria-labelledby="rt rd">
<title id="rt">One Flow run, stage by stage</title>
<desc id="rd">Onboard on the first run, then explore, plan, your approval, build, prove, report, optional pull request text, and your commit. A rejected plan returns to plan. A failed proof returns to build, three times at most.</desc>
