<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 344" role="img" aria-labelledby="t d">
<title id="t">Flow: agent skills for shipping a change with proof</title>
<desc id="d">A Flow report with three acceptance points: one passed, one failed even though unit tests were green, and one that could not run.</desc>
<text x="48" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" letter-spacing="2" fill="#0b6e6e">AGENT SKILLS</text>
<text x="44" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="104" font-weight="700" letter-spacing="-3" fill="#14212b">Flow</text>
<text x="48" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#566673">Ship a change with proof,</text>
<text x="48" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#566673">not with a promise.</text>
<rect x="600" y="32" width="552" height="280" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="624" y="68" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#566673">report.md</text>
<text x="1128" y="68" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#566673">1 passed · 1 failed · 1 could-not-run</text>
<line x1="600" y1="84" x2="1152" y2="84" stroke="#d0d7de"/>
<text x="624" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#14212b">A user can archive a note</text>
<text x="624" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#566673">POST /notes/7/archive returned 204</text>
<rect x="1056" y="118" width="72" height="26" rx="13" fill="#e2f3e8"/>
<text x="1092.0" y="135.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#1b7a43">passed</text><line x1="624" y1="168" x2="1128" y2="168" stroke="#d0d7de"/><text x="624" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#14212b">Another user cannot archive it</text>
<text x="624" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#566673">A second user got 204. Expected 404.</text>
<rect x="1064" y="182" width="64" height="26" rx="13" fill="#fbe4e1"/>
<text x="1096.0" y="199.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#a8322b">failed</text><line x1="624" y1="232" x2="1128" y2="232" stroke="#d0d7de"/><text x="624" y="256" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#14212b">The button matches the design</text>
<text x="624" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#566673">No design file was available</text>
<rect x="1004" y="246" width="124" height="26" rx="13" fill="#fbefd5"/>
<text x="1066.0" y="263.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#8a5800">could-not-run</text>
</svg>